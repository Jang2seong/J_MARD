# Nginx snippet to add to server block for serving the site with secure headers
# Place inside your server { } block for the site's vhost

add_header Content-Security-Policy "default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-to csp-endpoint; report-uri /csp-report;" always;
add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://<YOUR_DEPLOY_DOMAIN>/csp-report"}],"include_subdomains":true}' always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

# Optional: endpoint to accept CSP reports (requires location /csp-report handler)
location = /csp-report {
    return 204;
}
